name: Service Finder QA Audit

on:
  workflow_dispatch:

jobs:
  run-service-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Audit Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python check_services.py

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: service_audit_report
          path: service_audit_report.xlsx

      - name: Send Audit Report Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "BFY Service Finder Monthly Audit Report"
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: "BFY AI Checker <${{ secrets.MAIL_USERNAME }}>"
          body: "The monthly service finder audit has completed. The full Excel audit report is attached."
          attachments: service_audit_report.xlsx
